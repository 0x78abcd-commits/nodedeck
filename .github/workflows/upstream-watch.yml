name: 上游仓库更新提醒

# 每周检查上游仓库的新版本，有新版就在本仓库开一个 Issue，列出更新说明，方便决定要不要跟进。
# 原则：sing-box 内核由 singbox.yml 自动构建、VPS 自动升级；协议字段 / 配置格式的变化要人工确认、测试通过后再合入。
# 跟踪清单和理由见 docs/upstream-tracking.md。
on:
  schedule:
    - cron: '41 23 * * 0'   # 每周日 23:41 UTC（北京时间周一 07:41）
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # mode：releases（默认，看正式发布）/ tags（只有 tag 没有 Release 的）/ commits（脚本类仓库，看主分支提交）
          - { upstream: SagerNet/sing-box,            label: upstream-singbox,     short: sing-box,     mode: releases, pre: false, why: '内核：协议、配置字段、弃用项（以它为准）' }
          - { upstream: XTLS/Xray-core,               label: upstream-xray,        short: Xray,         mode: releases, pre: false, why: '内核：VLESS-XHTTP-Reality / VLESS-XHTTP-TLS 用 Xray 跑，XHTTP 参数和弃用项以它为准' }
          - { upstream: apernet/hysteria,             label: upstream-hysteria,    short: Hysteria,     mode: releases, pre: false, why: 'Hysteria2 协议规范、分享链接参数' }
          - { upstream: tuic-protocol/tuic,           label: upstream-tuic,        short: TUIC,         mode: releases, pre: false, why: 'TUIC v5 变更' }
          - { upstream: cloudflare/cloudflared,       label: upstream-cloudflared, short: cloudflared,  mode: releases, pre: false, why: 'Cloudflare 隧道：连接协议、版本兼容、弃用通知（NodeDeck 的隧道用 sing-box 内置的 cloudflared）' }
          - { upstream: 2dust/v2rayNG,                label: upstream-v2rayng,     short: v2rayNG,      mode: releases, pre: false, why: '安卓客户端兼容、链接导入（如 allowInsecure 被移除）' }
          - { upstream: 2dust/v2rayN,                 label: upstream-v2rayn,      short: v2rayN,       mode: releases, pre: false, why: 'Windows 客户端兼容' }
          - { upstream: MetaCubeX/mihomo,             label: upstream-mihomo,      short: mihomo,       mode: releases, pre: false, why: 'Clash Meta 订阅字段' }
          - { upstream: LloydAsp/NodeQuality,         label: upstream-nodequality, short: NodeQuality,  mode: commits,  pre: false, why: '社区测试直接运行它的脚本：交互选项或报告链接格式变了，NodeDeck 要跟着改' }
          - { upstream: ibsgss/TcpQuality,            label: upstream-tcpquality,  short: TcpQuality,   mode: commits,  pre: false, why: '社区测试直接运行它的脚本：参数或报告链接格式变了要跟着改' }
          - { upstream: ClickDevTech/CELERITY-panel,  label: upstream-celerity,    short: CELERITY,     mode: tags,     pre: false, why: '同类面板（MIT）：Xray XHTTP、级联中转、负载均衡、外部探针的做法可以参考' }
          - { upstream: nezhahq/nezha,              label: upstream-nezha,       short: 哪吒,         mode: releases, pre: false, why: '探针参考：服务器卡片、流量 / 到期展示、告警规则的做法（NodeDeck 探针只读，不做远程命令）' }
          - { upstream: henrygd/beszel,             label: upstream-beszel,      short: Beszel,       mode: releases, pre: false, why: '探针参考（MIT）：轻量采集、历史曲线、告警阈值和通知渠道' }
          - { upstream: Teminuosi/tms-client,       label: upstream-tms,         short: TMS,          mode: releases, pre: true,  why: '同类桌面工具：功能灵感（不公开源码，只看更新说明，自己实现；不解包安装包）' }
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: ${{ matrix.upstream }}
      LABEL: ${{ matrix.label }}
      SHORT: ${{ matrix.short }}
      PRE: ${{ matrix.pre }}
      MODE: ${{ matrix.mode }}
      WHY: ${{ matrix.why }}
    steps:
      - name: 检查新版本并开 Issue
        run: |
          set -e
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color 1d76db --description "$SHORT 的更新" --force >/dev/null

          # 上次已经提醒到的版本，记在最近一个 Issue 的 <!-- last: x --> 里
          LAST=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state all --limit 1 --json body \
                 --jq '.[0].body // ""' | grep -oP '(?<=<!-- last: )[^ ]+' || true)
          echo "上次提醒到：${LAST:-无}"

          # 统一成 [{tag_name, published_at, body, html_url}]，从新到旧
          case "${MODE:-releases}" in
            commits)
              gh api "repos/$UPSTREAM/commits?per_page=30" \
                --jq '[.[] | {tag_name: .sha[0:7], published_at: .commit.committer.date, body: .commit.message, html_url: .html_url, draft: false, prerelease: false}]' > releases.json ;;
            tags)
              gh api "repos/$UPSTREAM/tags?per_page=30" \
                --jq '[.[] | {tag_name: .name, published_at: "", body: ("https://github.com/'"$UPSTREAM"'/releases/tag/" + .name), html_url: "", draft: false, prerelease: false}]' > releases.json ;;
            *)
              gh api "repos/$UPSTREAM/releases?per_page=30" > releases.json ;;
          esac
          # 从新到旧取，遇到上次的版本就停；第一次运行只取最新一个，避免刷屏
          jq -r --arg last "$LAST" --argjson pre "$PRE" '
            [ .[] | select(.draft|not) | select($pre or (.prerelease|not)) ] as $r
            | if ($r|length) == 0 then []
              elif $last == "" then [$r[0]]
              else [ $r | to_entries[] | select(.key < ([$r[] | .tag_name] | index($last) // 30)) | .value ]
              end
            | .[] | @base64' releases.json > new.txt

          if [ ! -s new.txt ]; then echo "没有新版本"; exit 0; fi

          NEWEST=$(head -1 new.txt | base64 -d | jq -r .tag_name)
          OLDEST=$(tail -1 new.txt | base64 -d | jq -r .tag_name)
          COUNT=$(wc -l < new.txt)
          {
            if [ "$MODE" = commits ]; then echo "[$UPSTREAM](https://github.com/$UPSTREAM/commits) 有 $COUNT 个新提交。"; else echo "[$UPSTREAM](https://github.com/$UPSTREAM/releases) 发布了 $COUNT 个新版本。"; fi
            echo
            echo "**为什么跟踪**：$WHY"
            echo
            echo "处理方式：内核自动升级不用管；新协议字段、配置格式、分享链接参数、测试脚本的变化需要改代码，测试通过后再合入（需要跟进时在 Claude 对话里说一声）。"
            echo
            while read -r line; do
              r=$(echo "$line" | base64 -d)
              echo "## $(echo "$r" | jq -r .tag_name)（$(echo "$r" | jq -r '(.published_at // "")[:10]')）"
              echo
              echo "$r" | jq -r '(.body // "（无说明）") | if length > 4000 then .[:4000] + "\n\n…（太长已截断，看原文）" else . end'
              echo
            done < new.txt
            echo "<!-- last: $NEWEST -->"
          } > body.md

          head -c 60000 body.md > body2.md && grep -q '<!-- last:' body2.md || echo "<!-- last: $NEWEST -->" >> body2.md
          mv body2.md body.md
          if [ "$COUNT" = 1 ]; then TITLE="[上游] $SHORT $NEWEST 更新说明"; else TITLE="[上游] $SHORT $OLDEST ~ $NEWEST 更新说明"; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" --title "$TITLE" --body-file body.md
