name: Release

# 两种发布方式：
#  1. 在 GitHub 网页 Actions → Release → Run workflow，输入版本号（如 0.2.0）
#  2. 本地 git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.2.0，不要带 v）'
        required: true

permissions:
  contents: write

jobs:
  # 定发版用的提交。GitHub 不允许 Actions 自带的令牌在「改了 .github/workflows 的提交」上建 tag / Release
  # （0.8.7 就因此失败）。遇到这种情况先在 main 上推一个空提交（内容完全一样），在空提交上发版。
  target:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.t.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: t
        run: |
          SHA="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git diff --name-only HEAD~1 HEAD | grep -q '^\.github/workflows/'; then
            echo "最新提交改了工作流文件，推一个空提交再发版"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "发版 v${{ github.event.inputs.version }}（空提交：上一个提交改了工作流，GitHub 不允许直接在它上面建 Release）"
            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "::error::推空提交失败（$GITHUB_REF_NAME 在发版期间有了新提交？）。重新运行发版即可"
              exit 1
            fi
            SHA=$(git rev-parse HEAD)
          fi
          echo "发版提交：$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # 确保服务端 sing-box 内核已发布（已是最新则直接跳过）
  singbox:
    uses: ./.github/workflows/singbox.yml

  linux-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Resolve version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Test agent
        run: cd agent && go vet ./... && go test ./...
      - name: Build agent
        run: |
          mkdir -p out
          cd agent
          for a in amd64 arm64 arm 386; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o ../out/nodedeck-agent-linux-$a .
            gzip -9 ../out/nodedeck-agent-linux-$a
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: out/*

  windows:
    needs: [target, singbox, linux-binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: out
      - name: Prepare resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force resources/agent, resources/bin | Out-Null
          Copy-Item out/nodedeck-agent-linux-*.gz resources/agent/
          # 节点测试用的 Windows 版 sing-box：取官方最新正式版
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/SagerNet/sing-box/releases/latest
          $v = $rel.tag_name.TrimStart('v')
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sbtmp
          Copy-Item "sbtmp/sing-box-$v-windows-amd64/*" resources/bin/
          Move-Item -Force resources/bin/LICENSE resources/bin/LICENSE-sing-box.txt
          # XHTTP 节点本地测试用的 Windows 版 Xray：取官方最新正式版，校验官方 SHA2-256
          $xr = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/XTLS/Xray-core/releases/latest
          $xu = "https://github.com/XTLS/Xray-core/releases/download/$($xr.tag_name)/Xray-windows-64.zip"
          Invoke-WebRequest $xu -OutFile xr.zip
          Invoke-WebRequest "$xu.dgst" -OutFile xr.dgst
          $want = ((Get-Content xr.dgst | Where-Object { $_ -match '^SHA2-256=' }) -replace '^SHA2-256=\s*', '').Trim().ToLower()
          $have = (Get-FileHash xr.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $want -ne $have) { throw "Xray-windows-64.zip 的 SHA2-256 对不上（官方 $want，下载 $have）" }
          Expand-Archive xr.zip -DestinationPath xrtmp
          Copy-Item xrtmp/xray.exe resources/bin/
          Copy-Item xrtmp/LICENSE resources/bin/LICENSE-xray.txt
      - name: Set version and publish target
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          node scripts/ci-prepare.js "$V" "$GITHUB_REPOSITORY"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build
        run: npx electron-builder --win --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自己统一上传，避免 electron-builder 并发创建 Release 冲突
          # latest.yml + blockmap 是安装版自动更新必需的
          FILES=(dist/NodeDeck-Setup-$VERSION.exe dist/NodeDeck-Setup-$VERSION.exe.blockmap dist/NodeDeck-$VERSION-portable.exe dist/latest.yml)
          ls -la "${FILES[@]}"
          # Release 说明取 CHANGELOG.md 里对应版本的一节
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "NodeDeck $VERSION" > notes.md
          cat notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${FILES[@]}" --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" "${FILES[@]}" --title "NodeDeck $VERSION" --notes-file notes.md --target "${{ needs.target.outputs.sha }}"
          fi
