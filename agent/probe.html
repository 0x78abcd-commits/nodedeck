<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>服务器状态</title>
<style>
:root {
  --bg: #eef2f1; --card: #ffffff; --ink: #16302b; --muted: #5f7470; --line: #d7e0de;
  --accent: #1f7a6b; --accent-soft: #d4ebe6; --warn: #b8731a; --bad: #b93a34; --track: #e6ecea;
  --shadow: 0 1px 0 rgba(22, 48, 43, .06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1715; --card: #15211f; --ink: #dce7e4; --muted: #8fa39f; --line: #24332f;
    --accent: #4fb8a4; --accent-soft: #1d3a34; --warn: #e0a44a; --bad: #e7726b; --track: #1f2c29; --shadow: none; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 18px; }
h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: .01em; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; }
.sum b { color: var(--ink); font-weight: 600; }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.groups { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; }
.card.off { opacity: .62; }
.top { display: flex; align-items: center; gap: 8px; }
.flag { font-size: 18px; line-height: 1; width: 22px; text-align: center; }
.name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.off .dot { background: var(--bad); box-shadow: none; }
.state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.spark { display: block; width: 100%; height: 34px; margin: 10px 0 6px; }
.spark .rx { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark .tx { fill: none; stroke: var(--warn); stroke-width: 1.2; stroke-dasharray: 3 2; }
.net { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.net b { color: var(--ink); font-weight: 600; font-size: 13px; }
.meters { display: grid; gap: 6px; margin: 10px 0 8px; }
.m { display: grid; grid-template-columns: 34px 1fr 74px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.bar i.w { background: var(--warn); } .bar i.b { background: var(--bad); }
.m span:last-child { text-align: right; color: var(--ink); }
.offmsg { margin: 14px 0 12px; font-size: 13px; color: var(--bad); }
.foot { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.foot .bad { color: var(--bad); } .foot .warn { color: var(--warn); }
.lat { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.lat b { font-weight: 600; color: var(--ink); }
/* 列表视图 */
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 13px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--accent-soft); }
tr.off td { color: var(--muted); }
.tbl { overflow-x: auto; border-radius: 12px; }
.mini { display: inline-block; width: 64px; vertical-align: middle; margin-right: 6px; }
.mini .bar { display: block; }
/* 详情 */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 20, 18, .38); display: flex; justify-content: flex-end; z-index: 9; }
.sheet { width: min(680px, 100%); height: 100%; background: var(--bg); overflow-y: auto; padding: 18px 18px 40px; animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .bar i { transition: none; } }
.sheet h2 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 8px; }
.sheet .row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.sheet .row .x { margin-left: auto; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
.fact { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.fact small { display: block; color: var(--muted); font-size: 12px; }
.fact b { font-weight: 600; }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px; margin-bottom: 10px; }
.chart h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; display: flex; gap: 12px; align-items: baseline; }
.chart h3 small { color: var(--muted); font-weight: 400; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 10px; }
.k1 { stroke: var(--accent); } .k2 { stroke: var(--warn); } .k3 { stroke: #6b7fd1; }
.chart path { fill: none; stroke-width: 1.5; }
.legend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 400; }
.legend i { width: 10px; height: 2px; display: inline-block; }
.legend .k1 { background: var(--accent); } .legend .k2 { background: var(--warn); } .legend .k3 { background: #6b7fd1; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.note { color: var(--muted); font-size: 12px; margin-top: 18px; }
@media (max-width: 560px) { h1 { font-size: 19px; } .tools { margin-left: 0; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">服务器状态</h1>
      <div class="sum" id="sum"></div>
    </div>
    <div class="tools" role="group" aria-label="显示方式">
      <button id="vCard" aria-pressed="true">卡片</button>
      <button id="vList" aria-pressed="false">列表</button>
    </div>
  </header>
  <div class="groups" id="groups"></div>
  <main id="main"><div class="empty">正在读取…</div></main>
  <div class="note" id="note"></div>
</div>
<script>
'use strict';
const base = location.pathname.replace(/\/?$/, '/');
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let view = (() => { try { return localStorage.getItem('nd-probe-view') || 'card'; } catch (_) { return 'card'; } })();
let group = '';
let data = null;
let lastErr = '';
const hist = {}; // id → 最近 60 次（5 分钟）的网速，画卡片上的小曲线

function bytes(n, rate) {
  n = Number(n) || 0;
  const u = rate ? ['B/s', 'KB/s', 'MB/s', 'GB/s'] : ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}
function dur(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' 分钟';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时';
  return Math.floor(s / 86400) + ' 天';
}
function flag(cc) {
  if (!/^[A-Za-z]{2}$/.test(cc || '')) return '🌐';
  return String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1f1a5 + c.charCodeAt(0)));
}
function lvl(p) { return p >= 90 ? 'b' : p >= 75 ? 'w' : ''; }
function meter(label, pct, text) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  return `<div class="m"><span>${label}</span><div class="bar" role="meter" aria-valuenow="${p.toFixed(0)}" aria-valuemin="0" aria-valuemax="100" aria-label="${label}"><i class="${lvl(p)}" style="width:${p}%"></i></div><span>${text ?? p.toFixed(0) + '%'}</span></div>`;
}
function spark(id, w = 240, hgt = 34) {
  const h = hist[id] || [];
  if (h.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"></svg>`;
  const max = Math.max(1024, ...h.map((x) => Math.max(x.rx, x.tx)));
  // 从右往左排：最新的点在最右边，攒满 5 分钟后整条铺满
  const pts = (k) => h.map((x, i) => `${(w - (h.length - 1 - i) / 59 * w).toFixed(1)},${(hgt - 2 - (x[k] / max) * (hgt - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none" aria-hidden="true"><polyline class="tx" points="${pts('tx')}"/><polyline class="rx" points="${pts('rx')}"/></svg>`;
}
function info(s) {
  const d = s.data || {};
  const live = d.live || d.now || {};
  const disk = d.diskTotal ? d.diskUsed / d.diskTotal * 100 : 0;
  const month = d.month || {};
  const used = (month.rx || 0) + (month.tx || 0);
  const quota = s.quotaGB > 0 ? used / (s.quotaGB * 1073741824) * 100 : -1;
  const days = s.expireAt ? Math.ceil((s.expireAt * 1000 - Date.now()) / 86400e3) : null;
  const lat = (d.now && d.now.lat) || {};
  return { d, live, disk, used, quota, days, lat };
}
function expText(days) {
  if (days === null) return '';
  if (days < 0) return `<span class="bad">已过期 ${-days} 天</span>`;
  return `<span class="${days <= 7 ? 'warn' : ''}">${days} 天后到期</span>`;
}
function latText(lat) {
  const ks = Object.keys(lat);
  if (!ks.length) return '';
  return '<div class="lat">' + ks.map((k) => `<span>${esc(k)} <b>${lat[k] >= 0 ? Math.round(lat[k]) + 'ms' : '超时'}</b></span>`).join('') + '</div>';
}
function card(s) {
  const x = info(s);
  const st = s.online ? `在线 ${dur(x.d.uptime || 0)}` : (s.since ? `离线 ${dur(Date.now() / 1000 - s.since)}` : '连不上');
  const memText = s.memMB ? `${(x.live.mem || 0).toFixed(0)}% · ${s.memMB < 1024 ? s.memMB + 'M' : (s.memMB / 1024).toFixed(0) + 'G'}` : null;
  return `<article class="card ${s.online ? '' : 'off'}" tabindex="0" data-id="${esc(s.id)}" aria-label="${esc(s.name)}，${s.online ? '在线' : '离线'}">
    <div class="top"><span class="flag" aria-hidden="true">${flag(s.cc)}</span><span class="name">${esc(s.name)}</span><span class="state">${st}</span><span class="dot" aria-hidden="true"></span></div>
    ${s.online ? `${spark(s.id)}
    <div class="net"><span>↓ <b>${bytes(x.live.rx, 1)}</b></span><span>↑ <b>${bytes(x.live.tx, 1)}</b></span><span>负载 <b>${(x.live.load || 0).toFixed(2)}</b></span></div>
    <div class="meters">${meter('CPU', x.live.cpu)}${meter('内存', x.live.mem, memText)}${meter('磁盘', x.disk)}${x.quota >= 0 ? meter('流量', x.quota) : ''}</div>`
    : `<div class="offmsg">${s.lastOk ? '最后收到数据：' + dur(Date.now() / 1000 - s.lastOk) + '前' : '主控一直没连上它'}</div>`}
    <div class="foot"><span>本月 ${bytes(x.used)}${s.quotaGB > 0 ? ' / ' + s.quotaGB + ' GB' : ''}</span>${expText(x.days)}${x.d.cores ? `<span>${x.d.cores} 核</span>` : ''}${s.online && x.d.nodeOk === false ? '<span class="bad">节点服务异常</span>' : ''}</div>
    ${latText(x.lat)}
  </article>`;
}
function row(s) {
  const x = info(s);
  return `<tr class="${s.online ? '' : 'off'}" data-id="${esc(s.id)}" tabindex="0">
    <td>${flag(s.cc)} ${esc(s.name)}</td>
    <td>${s.online ? '在线 ' + dur(x.d.uptime || 0) : '<span style="color:var(--bad)">离线</span>'}</td>
    ${s.online ? `<td><span class="mini"><span class="bar"><i class="${lvl(x.live.cpu)}" style="width:${x.live.cpu || 0}%"></i></span></span>${(x.live.cpu || 0).toFixed(0)}%</td>
    <td><span class="mini"><span class="bar"><i class="${lvl(x.live.mem)}" style="width:${x.live.mem || 0}%"></i></span></span>${(x.live.mem || 0).toFixed(0)}%</td>
    <td>${x.disk.toFixed(0)}%</td>
    <td>↓${bytes(x.live.rx, 1)} ↑${bytes(x.live.tx, 1)}</td>` : '<td>—</td><td>—</td><td>—</td><td>—</td>'}
    <td>${bytes(x.used)}${s.quotaGB > 0 ? ' / ' + s.quotaGB + 'G' : ''}</td>
    <td>${x.days === null ? '' : x.days < 0 ? '已过期' : x.days + ' 天'}</td>
  </tr>`;
}
function render() {
  if (!data) return;
  $('#title').textContent = data.title || '服务器状态';
  document.title = data.title || '服务器状态';
  const all = data.servers;
  const groups = [...new Set(all.map((s) => s.group).filter(Boolean))];
  $('#groups').innerHTML = groups.length ? ['', ...groups].map((g) => `<button data-g="${esc(g)}" aria-pressed="${g === group}">${g ? esc(g) : '全部'}</button>`).join('') : '';
  const list = all.filter((s) => !group || s.group === group);
  const on = list.filter((s) => s.online);
  const sum = (k) => on.reduce((a, s) => a + ((s.data?.live || {})[k] || 0), 0);
  const month = list.reduce((a, s) => a + (s.data?.month?.rx || 0) + (s.data?.month?.tx || 0), 0);
  $('#sum').innerHTML = `<span>在线 <b>${on.length}</b> / ${list.length}</span><span>↓ <b>${bytes(sum('rx'), 1)}</b> ↑ <b>${bytes(sum('tx'), 1)}</b></span><span>本月合计 <b>${bytes(month)}</b></span>`;
  if (!list.length) { $('#main').innerHTML = '<div class="empty">还没有服务器</div>'; return; }
  const sorted = [...list].sort((a, b) => (b.online - a.online));
  $('#main').innerHTML = view === 'card'
    ? `<div class="grid">${sorted.map(card).join('')}</div>`
    : `<div class="tbl"><table><thead><tr><th>服务器</th><th>状态</th><th>CPU</th><th>内存</th><th>磁盘</th><th>网速</th><th>本月流量</th><th>到期</th></tr></thead><tbody>${sorted.map(row).join('')}</tbody></table></div>`;
  $('#note').textContent = lastErr ? '⚠ ' + lastErr : `每 5 秒刷新 · ${new Date(data.now * 1000).toLocaleTimeString()}`;
}
async function poll() {
  try {
    const r = await fetch(base + 'api/servers', { cache: 'no-store' });
    if (!r.ok) throw new Error('读取失败（' + r.status + '）');
    data = await r.json();
    lastErr = '';
    for (const s of data.servers) {
      const live = s.data?.live; if (!live || !s.online) continue;
      const h = hist[s.id] || (hist[s.id] = []);
      h.push({ rx: live.rx || 0, tx: live.tx || 0 }); if (h.length > 60) h.shift();
    }
  } catch (e) { lastErr = '连不上主控：' + e.message; }
  render();
}
function setView(v) {
  view = v; try { localStorage.setItem('nd-probe-view', v); } catch (_) {}
  $('#vCard').setAttribute('aria-pressed', v === 'card'); $('#vList').setAttribute('aria-pressed', v === 'list'); render();
}
$('#vCard').onclick = () => setView('card');
$('#vList').onclick = () => setView('list');
$('#groups').onclick = (e) => { const b = e.target.closest('button'); if (b) { group = b.dataset.g; render(); } };
function openFrom(e) { const el = e.target.closest('[data-id]'); if (el) detail(el.dataset.id); }
$('#main').addEventListener('click', openFrom);
$('#main').addEventListener('keydown', (e) => { if (e.key === 'Enter') openFrom(e); });

// ---------- 详情 ----------
function chart(title, series, opt = {}) {
  const W = 600, H = 130, L = 62, B = 18;
  const pts = series.flatMap((s) => s.pts);
  if (new Set(pts.map((p) => p[0])).size < 2) return `<div class="chart"><h3>${title}</h3><div class="empty" style="padding:18px 0">数据还不够画曲线，过一会儿再看</div></div>`;
  const t0 = Math.min(...pts.map((p) => p[0])), t1 = Math.max(...pts.map((p) => p[0])) || t0 + 1;
  const max = opt.max || Math.max(opt.min || 1, ...pts.map((p) => p[1])) * 1.1;
  const X = (t) => L + (t - t0) / Math.max(1, t1 - t0) * (W - L - 4);
  const Y = (v) => (H - B) - Math.min(v, max) / max * (H - B - 6);
  const fmt = opt.fmt || ((v) => v.toFixed(0));
  const ticks = [0, max / 2, max].map((v) => `<text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text><line class="ax" x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke-dasharray="${v ? '2 3' : ''}"/>`).join('');
  const tl = (t) => { const d = new Date(t * 1000); return opt.days ? `${d.getMonth() + 1}/${d.getDate()}` : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const xt = [t0, (t0 + t1) / 2, t1].map((t, i) => `<text x="${X(t)}" y="${H - 4}" text-anchor="${['start', 'middle', 'end'][i]}">${tl(t)}</text>`).join('');
  const paths = series.map((s) => {
    let d = '', prev = null;
    for (const [t, v] of s.pts) { d += (prev !== null && t - prev > opt.gap ? 'M' : (d ? 'L' : 'M')) + X(t).toFixed(1) + ',' + Y(v).toFixed(1); prev = t; }
    return `<path class="${s.k}" d="${d}"/>`;
  }).join('');
  const legend = series.length > 1 ? series.map((s) => `<span class="legend"><i class="${s.k}"></i>${s.name}</span>`).join('') : '';
  return `<div class="chart"><h3>${title} ${legend}${opt.sub ? `<small>${opt.sub}</small>` : ''}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${ticks}${xt}${paths}</svg></div>`;
}
async function detail(id, rng = '24h') {
  const s = data?.servers.find((x) => x.id === id); if (!s) return;
  document.querySelector('.sheet-bg')?.remove();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.name)}"><div class="row"><h2>${flag(s.cc)} ${esc(s.name)}</h2><button data-r="24h" aria-pressed="${rng === '24h'}">24 小时</button><button data-r="30d" aria-pressed="${rng === '30d'}">30 天</button><button class="x" aria-label="关闭">✕</button></div><div id="dbody"><div class="empty">正在读取…</div></div></div>`;
  document.body.append(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.onclick = (e) => { if (e.target === bg || e.target.closest('.x')) close(); const r = e.target.closest('[data-r]'); if (r) { close(); detail(id, r.dataset.r); } };
  bg.querySelector('.x').focus();
  const x = info(s);
  const facts = [
    ['状态', s.online ? '在线' : '离线' + (s.since ? ' ' + dur(Date.now() / 1000 - s.since) : '')],
    ['已运行', s.online ? dur(x.d.uptime || 0) : '—'],
    ['CPU', x.d.cores ? x.d.cores + ' 核' : '—'],
    ['内存', s.memMB ? (s.memMB / 1024).toFixed(1) + ' GB' : '—'],
    ['磁盘', x.d.diskTotal ? `${bytes(x.d.diskUsed)} / ${bytes(x.d.diskTotal)}` : '—'],
    ['本月流量', `↓${bytes(x.d.month?.rx)} ↑${bytes(x.d.month?.tx)}`],
  ];
  if (s.quotaGB > 0) facts.push(['额度', `${s.quotaGB} GB，已用 ${x.quota.toFixed(0)}%`]);
  if (x.days !== null) facts.push(['到期', x.days < 0 ? `已过期 ${-x.days} 天` : `${x.days} 天后（${new Date(s.expireAt * 1000).toLocaleDateString()}）`]);
  let body = `<div class="facts">${facts.map(([k, v]) => `<div class="fact"><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div>`;
  try {
    const r = await fetch(`${base}api/history?id=${encodeURIComponent(id)}&range=${rng}`, { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    const ser = j.series || [];
    const days = rng === '30d';
    const gap = days ? 7200 : 1800;
    const p = (k) => ser.map((v) => [v.t, v[k] || 0]);
    body += chart('CPU', [{ k: 'k1', pts: p('cpu') }], { max: 100, fmt: (v) => v.toFixed(0) + '%', days, gap });
    body += chart('内存', [{ k: 'k1', pts: p('mem') }], { max: 100, fmt: (v) => v.toFixed(0) + '%', days, gap });
    body += chart('网速', [{ k: 'k1', name: '下行', pts: p('rx') }, { k: 'k2', name: '上行', pts: p('tx') }], { min: 1024, fmt: (v) => bytes(v, 1), days, gap });
    const names = [...new Set(ser.flatMap((v) => Object.keys(v.lat || {})))];
    if (names.length) {
      const ks = ['k1', 'k2', 'k3'];
      body += chart('三网延迟', names.map((n, i) => ({ k: ks[i % 3], name: n, pts: ser.filter((v) => v.lat && v.lat[n] >= 0).map((v) => [v.t, v.lat[n]]) })), { min: 50, fmt: (v) => v.toFixed(0) + 'ms', days, gap, sub: '从这台机器 ping 国内三网' });
    }
    body += chart('负载', [{ k: 'k1', pts: p('load') }], { min: 1, fmt: (v) => v.toFixed(1), days, gap });
  } catch (e) { body += `<div class="empty">读不到曲线：${esc(e.message)}</div>`; }
  const el = bg.querySelector('#dbody'); if (el) el.innerHTML = body;
}

setView(view);
poll();
setInterval(() => { if (!document.hidden) poll(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
